name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 本机没有 Docker，镜像的可构建性与启动自检只能放在 CI 里验证。
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: edu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke run
        run: |
          docker run -d --name edu -p 8000:8000 edu:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs edu
          docker rm -f edu >/dev/null
          [ "$ok" = "1" ] || { echo "container never became healthy"; exit 1; }

      - name: Frontend is served
        run: |
          docker run -d --name edu -p 8000:8000 edu:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="app">'
          docker rm -f edu >/dev/null

  # 真正跑一遍 deploy.sh：起容器 → 健康检查 → 改密码 → status/backup → down。
  # 镜像由上一个 job 构建并写入 gha 缓存，这里用 --no-build 直接复用，不再冷构建一次。
  deploy:
    name: deploy.sh lifecycle
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: edu:1.5.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: deploy.sh up (--no-build)
        run: |
          bash -n deploy.sh
          EDU_NO_BUILD=1 bash deploy.sh -y --port 8123 --key sk-ci-placeholder | tee /tmp/deploy.log
          grep -q '部署完成' /tmp/deploy.log
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8123/api/health

      - name: demo account was hardened
        run: |
          test -s deploy/credentials.txt
          pass="$(sed -n 's/^password=//p' deploy/credentials.txt)"
          test "${#pass}" -eq 16
          login() {
            curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/api/teacher/login \
              -H 'Content-Type: application/json' -d "{\"username\":\"demo\",\"password\":\"$1\"}"
          }
          test "$(login "$pass")" = "200"
          test "$(login demo1234)" != "200"

      - name: status + backup
        run: |
          bash deploy.sh status
          bash deploy.sh backup
          newest="$(ls -1t backups/edu-data-*.tgz | head -n 1)"
          test -s "$newest"
          tar -tzf "$newest" > /tmp/backup.list
          grep -q 'edu.sqlite3' /tmp/backup.list

      - name: down keeps the data volume
        run: |
          bash deploy.sh down
          ! docker ps --format '{{.Names}}' | grep -qx edu
          docker volume inspect edu-data >/dev/null
